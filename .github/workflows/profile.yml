name: Refresh profile stats

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Render profile cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/render_profile.py
      - name: Commit updated cards
        run: |
          git add assets/profile-dark.svg assets/profile-light.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Refresh profile stats"
          git push
